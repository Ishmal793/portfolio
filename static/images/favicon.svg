<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Monogram Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Accent Dot Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38BDF8" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Outer Squircle with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Subtle Inset -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Monogram IS with precision alignment -->
  <text x="29" y="38" text-anchor="middle" dominant-baseline="central"
        fill="url(#textGrad)"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-weight="800" font-size="25" letter-spacing="-0.5px">IS</text>

  <!-- Electric Cyan Pulse Dot -->
  <circle cx="48" cy="38" r="3.2" fill="#38BDF8" filter="url(#cyanGlow)" />
</svg>
